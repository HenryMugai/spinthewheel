<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spin2Win Admin Dashboard</title>

    <!-- ==========================================================
         GOOGLE FONT
    =========================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- ==========================================================
         CSS
    =========================================================== -->

    <link rel="stylesheet"
          href="css/admin.css">

</head>

<body>

    <!-- ==========================================================
         HEADER
    =========================================================== -->

    <header class="admin-header">

        <div class="header-left">

            <img src="assets/images/logo/logo.png"
                 alt="Spin2Win Logo"
                 class="logo">

            <div>

                <h1>

                    Spin2Win

                </h1>

                <span>

                    Admin Dashboard

                </span>

            </div>

        </div>

        <div class="header-right">

            <button id="refreshDashboard">

                Refresh

            </button>

        </div>

    </header>

    <!-- ==========================================================
         MAIN
    =========================================================== -->

    <main class="dashboard">

        <!-- ======================================================
             ANALYTICS
        ======================================================= -->

        <section class="stats-grid">

            <div class="stat-card">

                <h3>Total Spins</h3>

                <h2 id="totalSpins">

                    0

                </h2>

            </div>

            <div class="stat-card">

                <h3>Total Wins</h3>

                <h2 id="totalWins">

                    0

                </h2>

            </div>

            <div class="stat-card">

                <h3>Total Losses</h3>

                <h2 id="totalLosses">

                    0

                </h2>

            </div>

            <div class="stat-card">

                <h3>Retries</h3>

                <h2 id="totalRetries">

                    0

                </h2>

            </div>

        </section>

        <!-- ======================================================
             PRIZES
        ======================================================= -->

        <section class="dashboard-card">

            <div class="card-header">

                <h2>

                    Prize Configuration

                </h2>

            </div>

            <div id="prizeContainer">

                <!-- Generated by admin.js -->

            </div>

            <div class="card-actions">

                <button id="addPrizeBtn">

                    + Add Prize

                </button>

                <button id="savePrizesBtn">

                    Save Changes

                </button>

            </div>

        </section>

        <!-- ======================================================
             HISTORY
        ======================================================= -->

        <section class="dashboard-card">

            <div class="card-header">

                <h2>

                    Spin History

                </h2>

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Date</th>

                            <th>Prize</th>

                            <th>Result</th>

                        </tr>

                    </thead>

                    <tbody id="historyTable">

                        <!-- Generated by admin.js -->

                    </tbody>

                </table>

            </div>

        </section>

        <!-- ======================================================
             ACTIONS
        ======================================================= -->

        <section class="dashboard-card">

            <div class="card-header">

                <h2>

                    Actions

                </h2>

            </div>

            <div class="actions-grid">

                <button id="exportAnalyticsBtn">

                    Export Analytics

                </button>

                <button id="resetAnalyticsBtn">

                    Reset Analytics

                </button>

                <button id="resetPrizesBtn">

                    Reset Prizes

                </button>

            </div>

        </section>

    </main>

    <!-- ==========================================================
         FOOTER
    =========================================================== -->

    <footer>

        © 2026 Spin2Win Admin Dashboard

    </footer>

    <!-- ==========================================================
         JAVASCRIPT
    =========================================================== -->

    <script src="js/storage.js"></script>

    <script src="js/prizes.js"></script>

    <script src="js/analytics.js"></script>

    <script src="js/admin.js"></script>

</body>

</html>
