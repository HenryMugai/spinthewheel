<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spin2Win | Kibao Edition</title>

    <!-- ==========================================================
         GOOGLE FONTS
    =========================================================== -->
    <link rel="icon"
          type="image/png"
          href="assets/images/logo/logo.png">


    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- ==========================================================
         CSS
    =========================================================== -->

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/animations.css">

</head>

<body>

    <!-- ==========================================================
         LOADING SCREEN
    =========================================================== -->

    <div id="loading-screen">

        <div class="loader"></div>

        <h2>Preparing your experience...</h2>

    </div>

    <!-- ==========================================================
         APPLICATION
    =========================================================== -->

    <main class="app">

        <!-- ======================================================
             HEADER
        ======================================================= -->

        <header class="header">

            <div class="logo">

                <img src="assets/images/logo/logo.png"
                     alt="Kibao Logo">

            </div>

        </header>

        <!-- ======================================================
             GAME AREA
        ======================================================= -->

        <section class="wheel-section">

            <!-- Pointer -->

            <div class="pointer">

                ▼

            </div>

            <!-- Wheel -->

            <div class="wheel-wrapper">

                <canvas id="wheelCanvas">

                    Your browser does not support HTML5 Canvas.

                </canvas>

            </div>

        </section>

        <!-- ======================================================
             BUTTON
        ======================================================= -->

        <section class="controls">

            <button id="spinBtn">

                🎯 SPIN TO WIN

            </button>

        </section>

        <!-- ======================================================
             FOOTER
        ======================================================= -->

        <footer>

            <p>

                Powered by
                <strong>Spin2Win</strong>

                &nbsp;|&nbsp;

                © 2026 Kibao Experience

            </p>

        </footer>

    </main>

    <!-- ==========================================================
     RESULT POPUP
========================================================== -->

<div class="popup-overlay hidden"
     id="winnerPopup">

    <div class="popup-card">

        <div class="popup-icon"
             id="popupIcon">

            🎉

        </div>

        <h2 id="popupTitle">

            Congratulations!

        </h2>

        <p id="popupSubtitle">

            You have won

        </p>

        <h1 id="winnerName">

            Bucket Hat

        </h1>

        <p class="popup-message"
           id="popupMessage">

            Please visit the Kibao desk
            to collect your prize.

        </p>

        <div class="popup-buttons">

            <button id="closePopup">

                COLLECT PRIZE

            </button>

        </div>

    </div>

</div>

    <!-- ==========================================================
         JAVASCRIPT
    =========================================================== -->

    <script src="js/storage.js"></script>
    <script src="js/prizes.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
